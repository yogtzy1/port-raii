<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio | Nama Anda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: url("background.jpg") center / cover no-repeat fixed;
      color: #e5e7eb;
    }

    /* OVERLAY */
    .app {
      min-height: 100vh;
      background: rgba(15, 23, 42, 0.8);
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(2, 6, 23, 0.95);
      z-index: 999;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .nav-links a {
      margin-left: 18px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #1e293b;
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      background: #38bdf8;
      color: #020617;
    }

    .lang-btn {
      margin-left: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 180px 20px 120px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cbd5f5;
      margin-bottom: 32px;
    }

    .hero-buttons a {
      display: inline-block;
      margin: 0 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #38bdf8;
      color: #020617;
      text-decoration: none;
      font-weight: 600;
    }

    .hero-buttons a:hover {
      background: #7dd3fc;
    }

    /* SECTION */
    .section {
      max-width: 1000px;
      margin: 0 auto 120px;
      padding: 0 20px;
    }

    .section h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    /* CARD */
    .card {
      background: rgba(2, 6, 23, 0.9);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding-bottom: 40px;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script>
  const { useState } = React;
  const { motion } = window["framer-motion"];

  function Portfolio() {
    const [lang, setLang] = useState("id");

    const t = {
      id: {
        role: "Web Developer & UI Designer",
        about: "Tentang Saya",
        articles: "Artikel",
        projects: "Proyek",
        contact: "Kontak",
        desc: "Deskripsi singkat konten."
      },
      en: {
        role: "Web Developer & UI Designer",
        about: "About Me",
        articles: "Articles",
        projects: "Projects",
        contact: "Contact",
        desc: "Short description."
      }
    }[lang];

    return React.createElement(
      "div",
      { className: "app" },

      /* NAV */
      React.createElement(
        "nav",
        null,
        React.createElement(
          "div",
          { className: "nav-inner" },
          React.createElement("strong", null, "Portfolio"),
          React.createElement(
            "div",
            { className: "nav-links" },
            React.createElement("a", { href: "#articles" }, t.articles),
            React.createElement("a", { href: "#projects" }, t.projects),
            React.createElement("a", { href: "#contact" }, t.contact),
            React.createElement(
              "button",
              { className: "lang-btn", onClick: () => setLang(lang === "id" ? "en" : "id") },
              lang === "id" ? "EN" : "ID"
            )
          )
        )
      ),

      /* HERO */
      React.createElement(
        motion.section,
        { className: "hero", initial: { opacity: 0, y: 40 }, animate: { opacity: 1, y: 0 } },
        React.createElement("h1", null, "Nama Anda"),
        React.createElement("p", null, t.role),
        React.createElement(
          "div",
          { className: "hero-buttons" },
          React.createElement("a", { href: "#articles" }, t.articles),
          React.createElement("a", { href: "#projects" }, t.projects),
          React.createElement("a", { href: "#contact" }, t.contact)
        )
      ),

      /* ARTICLES */
      React.createElement(
        "section",
        { className: "section", id: "articles" },
        React.createElement("h2", null, t.articles),
        React.createElement(
          "div",
          { className: "grid" },
          ["Artikel 1", "Artikel 2", "Artikel 3"].map((a, i) =>
            React.createElement("div", { key: i, className: "card" }, a)
          )
        )
      ),

      /* PROJECTS */
      React.createElement(
        "section",
        { className: "section", id: "projects" },
        React.createElement("h2", null, t.projects),
        React.createElement(
          "div",
          { className: "grid" },
          ["Project A", "Project B", "Project C"].map((p, i) =>
            React.createElement("div", { key: i, className: "card" }, p)
          )
        )
      ),

      /* CONTACT */
      React.createElement(
        "section",
        { className: "section", id: "contact" },
        React.createElement("h2", null, t.contact),
        React.createElement("div", { className: "card" }, "Email: email@anda.com")
      ),

      React.createElement("footer", null, "© 2026 Nama Anda")
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(Portfolio)
  );
</script>
</body>
</html>
