<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio | Nama Anda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: url("background.jpg") center / cover no-repeat fixed;
      color: #e5e7eb;
    }

    .app {
      min-height: 100vh;
      background: rgba(15, 23, 42, 0.75);
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      color: #cbd5f5;
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: #38bdf8;
    }

    .lang-btn {
      background: #1e293b;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      margin-left: 16px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 160px 20px 120px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cbd5f5;
      font-size: 1.1rem;
    }

    /* SECTION */
    .section {
      max-width: 1000px;
      margin: 0 auto 120px;
      padding: 0 20px;
    }

    .section h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    /* CARD */
    .card {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card p {
      color: #cbd5f5;
      line-height: 1.6;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding-bottom: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const { useState } = React;
    const { motion } = window["framer-motion"];

    function Portfolio() {
      const [lang, setLang] = useState("id");

      const text = {
        id: {
          role: "Web Developer & UI Designer",
          about: "Tentang Saya",
          aboutText:
            "Saya membangun website modern dengan fokus pada performa, estetika, dan pengalaman pengguna.",
          articles: "Artikel",
          projects: "Proyek",
          contact: "Kontak",
          desc: "Deskripsi singkat konten."
        },
        en: {
          role: "Web Developer & UI Designer",
          about: "About Me",
          aboutText:
            "I build modern websites with a strong focus on performance, aesthetics, and user experience.",
          articles: "Articles",
          projects: "Projects",
          contact: "Contact",
          desc: "Short description of the content."
        }
      };

      const t = text[lang];

      return React.createElement(
        "div",
        { className: "app" },

        /* NAVBAR */
        React.createElement(
          "nav",
          null,
          React.createElement(
            "div",
            { className: "nav-inner" },
            React.createElement("strong", null, "Portfolio"),
            React.createElement(
              "div",
              { className: "nav-links" },
              React.createElement("a", { href: "#about" }, t.about),
              React.createElement("a", { href: "#articles" }, t.articles),
              React.createElement("a", { href: "#projects" }, t.projects),
              React.createElement("a", { href: "#contact" }, t.contact),
              React.createElement(
                "button",
                {
                  className: "lang-btn",
                  onClick: () => setLang(lang === "id" ? "en" : "id")
                },
                lang === "id" ? "EN" : "ID"
              )
            )
          )
        ),

        /* HERO */
        React.createElement(
          motion.section,
          {
            className: "hero",
            initial: { opacity: 0, y: 40 },
            animate: { opacity: 1, y: 0 }
          },
          React.createElement("h1", null, "Nama Anda"),
          React.createElement("p", null, t.role)
        ),

        /* ABOUT */
        React.createElement(
          "section",
          { className: "section", id: "about" },
          React.createElement(
            motion.div,
            { className: "card", whileInView: { opacity: [0,1], y: [30,0] } },
            React.createElement("h2", null, t.about),
            React.createElement("p", null, t.aboutText)
          )
        ),

        /* ARTICLES */
        React.createElement(
          "section",
          { className: "section", id: "articles" },
          React.createElement("h2", null, t.articles),
          React.createElement(
            "div",
            { className: "grid" },
            ["Artikel 1", "Artikel 2", "Artikel 3"].map((a, i) =>
              React.createElement(
                motion.div,
                { key: i, className: "card", whileHover: { y: -8 } },
                React.createElement("h3", null, a),
                React.createElement("p", null, t.desc)
              )
            )
          )
        ),

        /* PROJECTS */
        React.createElement(
          "section",
          { className: "section", id: "projects" },
          React.createElement("h2", null, t.projects),
          React.createElement(
            "div",
            { className: "grid" },
            ["Project A", "Project B", "Project C"].map((p, i) =>
              React.createElement(
                motion.div,
                { key: i, className: "card", whileHover: { y: -8 } },
                React.createElement("h3", null, p),
                React.createElement("p", null, t.desc)
              )
            )
          )
        ),

        /* CONTACT */
        React.createElement(
          "section",
          { className: "section", id: "contact" },
          React.createElement(
            motion.div,
            { className: "card" },
            React.createElement("h2", null, t.contact),
            React.createElement("p", null, "Email: email@anda.com"),
            React.createElement("p", null, "WhatsApp: 08xxxxxxxx"),
            React.createElement("p", null, "LinkedIn: linkedin.com/in/anda")
          )
        ),

        React.createElement("footer", null, "© 2026 Nama Anda")
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(Portfolio)
    );
  </script>
</body>
</html>
