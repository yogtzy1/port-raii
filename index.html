<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio | Nama Anda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: url("background.jpg") center / cover no-repeat fixed;
      color: #e5e7eb;
    }

    /* OVERLAY */
    .overlay {
      min-height: 100vh;
      background: rgba(2, 6, 23, 0.78);
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(2, 6, 23, 0.95);
      z-index: 1000;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links a {
      margin-left: 12px;
      padding: 8px 16px;
      background: #1e293b;
      border-radius: 999px;
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      background: #38bdf8;
      color: #020617;
    }

    /* HERO */
    .hero {
      padding: 200px 20px 120px;
      text-align: center;
      animation: fadeUp 1s ease forwards;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .hero p {
      color: #cbd5f5;
      margin-bottom: 32px;
    }

    .hero-buttons a {
      display: inline-block;
      margin: 0 8px;
      padding: 12px 26px;
      background: #38bdf8;
      color: #020617;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    .hero-buttons a:hover {
      background: #7dd3fc;
    }

    /* SECTION */
    section {
      max-width: 1000px;
      margin: 0 auto 120px;
      padding: 0 20px;
    }

    section h2 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      padding: 28px;
      border-radius: 16px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding-bottom: 40px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="overlay">

    <!-- NAVBAR -->
    <nav>
      <div class="nav-inner">
        <strong>Portfolio</strong>
        <div class="nav-links">
          <a href="#artikel">Artikel</a>
          <a href="#proyek">Proyek</a>
          <a href="#kontak">Kontak</a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
      <h1>Nama Anda</h1>
      <p>Web Developer & UI Designer</p>
      <div class="hero-buttons">
        <a href="#artikel">Artikel</a>
        <a href="#proyek">Proyek</a>
        <a href="#kontak">Kontak</a>
      </div>
    </div>

    <!-- ARTIKEL -->
    <section id="artikel">
      <h2>Artikel</h2>
      <div class="grid">
        <div class="card">Artikel 1</div>
        <div class="card">Artikel 2</div>
        <div class="card">Artikel 3</div>
      </div>
    </section>

    <!-- PROYEK -->
    <section id="proyek">
      <h2>Proyek</h2>
      <div class="grid">
        <div class="card">Project A</div>
        <div class="card">Project B</div>
        <div class="card">Project C</div>
      </div>
    </section>

    <!-- KONTAK -->
    <section id="kontak">
      <h2>Kontak</h2>
      <div class="card">
        Email: email@anda.com
      </div>
    </section>

    <footer>© 2026 Nama Anda</footer>

  </div>
</body>
</html>
