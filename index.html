<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Portfolio | Nama Anda</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: Inter, system-ui, sans-serif;
  background: url("background.jpg") center / cover no-repeat fixed;
  color: #e5e7eb;
}

.overlay {
  min-height: 100vh;
  background: rgba(2, 6, 23, 0.78);
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(2, 6, 23, 0.95);
  z-index: 1000;
}

.nav-inner {
  max-width: 1100px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-links a,
.lang-btn {
  margin-left: 10px;
  padding: 8px 16px;
  background: #1e293b;
  border-radius: 999px;
  text-decoration: none;
  color: white;
  font-size: 0.85rem;
  border: none;
  cursor: pointer;
}

.nav-links a:hover,
.lang-btn:hover {
  background: #38bdf8;
  color: #020617;
}

/* HERO */
.hero {
  padding: 200px 20px 120px;
  text-align: center;
}

.hero h1 {
  font-size: 3rem;
  margin-bottom: 12px;
}

.hero p {
  color: #cbd5f5;
  margin-bottom: 32px;
}

.hero-buttons a {
  display: inline-block;
  margin: 0 8px;
  padding: 12px 26px;
  background: #38bdf8;
  color: #020617;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 600;
}

.hero-buttons a:hover {
  background: #7dd3fc;
}

/* SECTION */
section {
  max-width: 1100px;
  margin: 0 auto 120px;
  padding: 0 20px;
}

section h2 {
  font-size: 1.8rem;
  margin-bottom: 28px;
}

/* REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.8s ease;
}

.reveal.show {
  opacity: 1;
  transform: translateY(0);
}

/* ARTICLE CAROUSEL */
.article-carousel {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
}

.article-card {
  min-width: 300px;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 18px;
  overflow: hidden;
  scroll-snap-align: start;
}

.article-image {
  height: 180px;
  background-size: cover;
  background-position: center;
}

.article-content {
  padding: 20px;
}

/* PROJECT */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}

.card {
  background: rgba(15, 23, 42, 0.9);
  padding: 28px;
  border-radius: 16px;
}

/* CONTACT BUTTONS */
.contact-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 16px;
}

.contact-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 20px;
  border-radius: 999px;
  font-weight: 600;
  color: white;
  text-decoration: none;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.contact-btn svg {
  width: 20px;
  height: 20px;
}

.contact-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.whatsapp { background: #25D366; }
.gmail { background: #EA4335; }
.github { background: #111827; }
.linkedin { background: #0A66C2; }

footer {
  text-align: center;
  padding: 40px;
  color: #94a3b8;
}
</style>
</head>

<body>
<div class="overlay">

<nav>
  <div class="nav-inner">
    <strong>Portfolio</strong>
    <div class="nav-links">
      <a href="#artikel" data-id="Artikel" data-en="Articles">Artikel</a>
      <a href="#proyek" data-id="Proyek" data-en="Projects">Proyek</a>
      <a href="#kontak" data-id="Kontak" data-en="Contact">Kontak</a>
      <button class="lang-btn" onclick="toggleLang()">ID / EN</button>
    </div>
  </div>
</nav>

<div class="hero reveal">
  <h1>Nama Anda</h1>
  <p data-id="Web Developer & UI Designer"
     data-en="Web Developer & UI Designer">
     Web Developer & UI Designer
  </p>
  <div class="hero-buttons">
    <a href="#artikel">Artikel</a>
    <a href="#proyek">Proyek</a>
    <a href="#kontak">Kontak</a>
  </div>
</div>

<section id="artikel" class="reveal">
  <h2 data-id="Artikel" data-en="Articles">Artikel</h2>
  <div class="article-carousel">
    <div class="article-card">
      <div class="article-image" style="background-image:url('artikel1.jpg')"></div>
      <div class="article-content">
        <h3>Website Modern</h3>
        <p>Teknologi web terbaru.</p>
      </div>
    </div>
    <div class="article-card">
      <div class="article-image" style="background-image:url('artikel2.jpg')"></div>
      <div class="article-content">
        <h3>UI/UX</h3>
        <p>Desain profesional.</p>
      </div>
    </div>
    <div class="article-card">
      <div class="article-image" style="background-image:url('artikel3.jpg')"></div>
      <div class="article-content">
        <h3>Optimasi</h3>
        <p>Performa & SEO.</p>
      </div>
    </div>
  </div>
</section>

<section id="proyek" class="reveal">
  <h2 data-id="Proyek" data-en="Projects">Proyek</h2>
  <div class="grid">
    <div class="card">Project A</div>
    <div class="card">Project B</div>
    <div class="card">Project C</div>
  </div>
</section>

<section id="kontak" class="reveal">
  <h2 data-id="Kontak" data-en="Contact">Kontak</h2>
  <div class="contact-buttons">
    <a href="mailto:email@anda.com" class="contact-btn gmail">Gmail</a>
    <a href="https://wa.me/6281234567890" target="_blank" class="contact-btn whatsapp">WhatsApp</a>
    <a href="https://github.com/anda" target="_blank" class="contact-btn github">GitHub</a>
    <a href="https://linkedin.com/in/anda" target="_blank" class="contact-btn linkedin">LinkedIn</a>
  </div>
</section>

<footer>© 2026 Nama Anda</footer>
</div>

<script>
let lang = "id";
function toggleLang() {
  lang = lang === "id" ? "en" : "id";
  document.querySelectorAll("[data-id]").forEach(el => {
    el.textContent = el.dataset[lang];
  });
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add("show");
  });
}, { threshold: 0.15 });

document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
</script>

</body>
</html>
