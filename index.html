<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Portfolio | Hendra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}

body{
  font-family:Inter,system-ui,sans-serif;
  background:url("background.jpg") center/cover no-repeat fixed;
  color:#e5e7eb
}

.overlay{min-height:100vh;background:rgba(2,6,23,.78)}

/* ===== NAV ===== */
nav{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(2,6,23,.95);
  z-index:1000
}
.nav-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

/* ===== HAMBURGER ===== */
.menu-btn{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  background:#020617
}
.menu-btn span{
  width:22px;
  height:2px;
  background:#fff;
  margin:3px 0;
  transition:.3s
}

/* ===== DROPDOWN MENU ===== */
.menu-box{
  position:absolute;
  top:70px;
  right:20px;
  background:rgba(15,23,42,.95);
  border-radius:16px;
  padding:14px;
  display:none;
  flex-direction:column;
  gap:10px;
  box-shadow:0 20px 40px rgba(0,0,0,.6)
}
.menu-box a{
  padding:10px 18px;
  border-radius:999px;
  background:#1e293b;
  color:#fff;
  text-decoration:none;
  font-size:.9rem;
  text-align:center
}
.menu-box.show{display:flex}

/* ===== HERO ===== */
.hero{
  padding:200px 20px 120px;
  text-align:center
}
.hero h1{font-size:3rem;margin-bottom:12px}
.hero p{color:#cbd5f5}

/* ===== SECTION ===== */
section{
  max-width:1100px;
  margin:0 auto 120px;
  padding:0 20px
}
h2{margin-bottom:24px}

/* ===== REVEAL ===== */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:.8s
}
.reveal.show{opacity:1;transform:none}

/* ===== ARTIKEL ===== */
.article-carousel{
  display:flex;
  gap:24px;
  overflow-x:auto;
  padding-bottom:20px
}
.article-card{
  min-width:300px;
  background:rgba(15,23,42,.9);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.4)
}
.article-image{
  height:180px;
  background-size:cover;
  background-position:center
}
.article-content{padding:20px}

/* ===== BUTTON ===== */
.btn{
  margin-top:14px;
  display:inline-block;
  padding:10px 18px;
  border-radius:999px;
  background:#38bdf8;
  color:#020617;
  font-weight:600;
  text-decoration:none;
  cursor:pointer
}

/* ===== PROJECT ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:24px
}
.card{
  background:rgba(15,23,42,.9);
  padding:28px;
  border-radius:16px
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000
}
.modal-content{
  background:#020617;
  max-width:700px;
  width:90%;
  border-radius:18px;
  overflow:hidden;
  animation:pop .4s ease
}
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
.modal-img{
  width:100%;
  height:260px;
  object-fit:cover
}
.modal-body{padding:24px}
.modal-body p{color:#cbd5f5;line-height:1.6}
.close{color:#38bdf8;cursor:pointer}

/* ===== KONTAK ===== */
.contact-buttons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px
}
.contact-btn{
  padding:14px;
  border-radius:999px;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:600
}
.whatsapp{background:#25D366}
.gmail{background:#EA4335}
.github{background:#111827}
.linkedin{background:#0A66C2}

footer{text-align:center;padding:40px;color:#94a3b8}
</style>
</head>

<body>
<div class="overlay">

<nav>
  <div class="nav-inner">
    <strong>Portfolio</strong>

    <div class="menu-btn" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="menu-box" id="menuBox">
      <a href="#artikel" onclick="toggleMenu()">Artikel</a>
      <a href="#proyek" onclick="toggleMenu()">Proyek</a>
      <a href="#kontak" onclick="toggleMenu()">Kontak</a>
    </div>
  </div>
</nav>

<div class="hero reveal">
  <h1>Hendra</h1>
  <p>Web Developer & Pelajar</p>
</div>

<section id="artikel" class="reveal">
<h2>Artikel</h2>
<div class="article-carousel">
  <div class="article-card">
    <div class="article-image" style="background-image:url('artikel1.jpg')"></div>
    <div class="article-content">
      <h3>My Darling</h3>
      <p>All About Girlfriend</p>
      <span class="btn" onclick="openModal('My Darling','Kita menjalin hubungan ini pada tanggal 13 agustus 2024.','artikel1.jpg')">
        Baca Selengkapnya
      </span>
    </div>
  </div>
</div>
</section>

<section id="proyek" class="reveal">
<h2>Proyek</h2>
<div class="grid">
  <div class="card">
    <h3>Project A</h3>
    <p>Website Company Profile</p>
    <span class="btn" onclick="openModal('Project 1','Project profesional dengan performa tinggi.','artikel2.jpg')">
      Detail Proyek
    </span>
  </div>
</div>
</section>

<section id="kontak" class="reveal">
<h2>Kontak</h2>
<div class="contact-buttons">
  <a class="contact-btn gmail" href="yogiigaming90@gmail.com">Gmail</a>
  <a class="contact-btn whatsapp" href="https://wa.me/6285762184102">WhatsApp</a>
  <a class="contact-btn github" href="https://github.com/yogii">GitHub</a>
  <a class="contact-btn linkedin" href="https://sociabuzz.com/itsmeraii">LinkedIn</a>
</div>
</section>

<footer>© 2026 Hendra</footer>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <img id="modalImg" class="modal-img">
    <div class="modal-body">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <span class="close" onclick="closeModal()">Tutup</span>
    </div>
  </div>
</div>

<script>
function toggleMenu(){
  document.getElementById("menuBox").classList.toggle("show")
}

function openModal(title,text,img){
  modal.style.display="flex"
  modalTitle.innerText=title
  modalText.innerText=text
  modalImg.src=img
}
function closeModal(){
  modal.style.display="none"
}

const observer=new IntersectionObserver(e=>{
  e.forEach(x=>{
    if(x.isIntersecting) x.target.classList.add("show")
  })
},{threshold:.15})
document.querySelectorAll(".reveal").forEach(el=>observer.observe(el))
</script>

</body>
</html>
